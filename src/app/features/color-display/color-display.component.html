<section
  class="color-display glass-panel"
  [class.text-light]="textStyle() === 'light'"
  [class.text-dark]="textStyle() === 'dark'"
  [class.color-display--entering]="isEntering()"
  aria-label="Color information panel"
>
  <!-- Main hex display -->
  <div class="color-display__hero">
    <p class="color-display__label">Current Color</p>
    <div class="color-display__hex-wrapper">
      <input
        #hexInput
        type="text"
        class="color-display__hex-input"
        [value]="color().hex"
        (input)="onHexInput(hexInput.value)"
        (blur)="onHexBlur(hexInput)"
        (keydown.enter)="hexInput.blur()"
        aria-label="Edit hex color"
      />
    </div>

    <!-- WCAG Badge -->
    <div
      class="wcag-badge"
      [class]="'wcag-badge--' + wcag().rating"
      [attr.aria-label]="'WCAG contrast rating: ' + wcag().rating + ', ratio ' + wcag().ratio + ':1'"
    >
      <span class="wcag-badge__icon">
        @if (wcag().rating === 'fail') { ✕ } @else { ✓ }
      </span>
      <span class="wcag-badge__rating">{{ wcag().rating }}</span>
      <span class="wcag-badge__ratio">{{ wcag().ratio }}:1</span>
    </div>
  </div>

  <!-- Sliders manual adjustment -->
  <div
    class="color-sliders"
    aria-label="Adjust HSL values manually"
    [style.--slider-hue]="color().hsl.h"
    [style.--slider-sat]="color().hsl.s + '%'"
    [style.--slider-light]="color().hsl.l + '%'"
  >
    <div class="slider-group">
      <span class="slider-label">H: {{ color().hsl.h }}°</span>
      <input
        type="range"
        min="0"
        max="360"
        [value]="color().hsl.h"
        (input)="onHslSliderInput($event, 'h')"
        (change)="onHslSliderChange($event, 'h')"
        class="color-slider color-slider--hue"
        aria-label="Hue slider"
      />
    </div>
    <div class="slider-group">
      <span class="slider-label">S: {{ color().hsl.s }}%</span>
      <input
        type="range"
        min="0"
        max="100"
        [value]="color().hsl.s"
        (input)="onHslSliderInput($event, 's')"
        (change)="onHslSliderChange($event, 's')"
        class="color-slider color-slider--saturation"
        aria-label="Saturation slider"
      />
    </div>
    <div class="slider-group">
      <span class="slider-label">L: {{ color().hsl.l }}%</span>
      <input
        type="range"
        min="0"
        max="100"
        [value]="color().hsl.l"
        (input)="onHslSliderInput($event, 'l')"
        (change)="onHslSliderChange($event, 'l')"
        class="color-slider color-slider--lightness"
        aria-label="Lightness slider"
      />
    </div>
  </div>

  <!-- Format chips -->
  <ul class="format-list" aria-label="Color format values">
    @for (fmt of formats(); track fmt.label) {
      <li class="format-chip">
        <span class="format-chip__label">{{ fmt.label }}</span>
        <span class="format-chip__value" [attr.aria-label]="fmt.label + ' value: ' + fmt.value">
          {{ fmt.value }}
        </span>
        <button
          class="format-chip__copy glass-button"
          [class.format-chip__copy--copied]="isCopied(fmt.label)"
          (click)="copy(fmt.value, fmt.label)"
          [attr.aria-label]="'Copy ' + fmt.label + ' value'"
          type="button"
        >
          @if (isCopied(fmt.label)) {
            <span aria-hidden="true">✓</span>
            <span>Copied!</span>
          } @else {
            <span aria-hidden="true">⎘</span>
            <span>Copy</span>
          }
        </button>
      </li>
    }
  </ul>
</section>
