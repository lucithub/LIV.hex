<div class="app-shell">

  <!-- ── Toolbar ── -->
  <header class="toolbar">
    <button
      class="toolbar__btn glass-button"
      [class.toolbar__btn--active]="historyOpen()"
      (click)="toggleHistory()"
      aria-label="Toggle history panel (H)"
      aria-controls="history-panel"
      [attr.aria-expanded]="historyOpen()"
      type="button"
    >
      <span aria-hidden="true">◷</span>
      <span>History</span>
    </button>

    <div class="toolbar__logo" aria-label="LIV.hex color generator">
      <span class="toolbar__logo-dot" [style.background-color]="currentColor().hex" aria-hidden="true"></span>
      LIV<span class="toolbar__logo-accent">.hex</span>
    </div>

    <button
      class="toolbar__btn glass-button"
      [class.toolbar__btn--active]="exportOpen()"
      (click)="toggleExport()"
      aria-label="Toggle export panel (E)"
      aria-controls="export-panel"
      [attr.aria-expanded]="exportOpen()"
      type="button"
    >
      <span>Export</span>
      <span aria-hidden="true">⬡</span>
    </button>

    <!-- Lock button -->
    <button
      class="toolbar__btn glass-button toolbar__btn--lock"
      [class.toolbar__btn--locked]="isLocked()"
      (click)="toggleLock()"
      [attr.aria-label]="isLocked() ? 'Unlock palette (L)' : 'Lock palette (L)'"
      [attr.aria-pressed]="isLocked()"
      type="button"
    >
      <span aria-hidden="true">{{ isLocked() ? '🔒' : '🔓' }}</span>
    </button>
  </header>

  <!-- ── Main card ── -->
  <main class="main-content flex-center">
    <div class="center-card">
      <app-color-display
        [color]="currentColor()"
        (colorChanged)="onManualColorChange($event)"
      />

      <app-generate-button (generate)="onGenerate($event)" />

      <!-- Lock badge: visible only when palette is locked -->
      @if (isLocked()) {
        <div class="lock-badge" role="status" aria-live="polite">
          <span aria-hidden="true">🔒</span>
          <span>Palette locked — use sliders or unlock with <kbd>L</kbd></span>
        </div>
      }

      <app-palette-display
        [palette]="currentPalette()"
        [activeColorId]="currentColor().id"
        (colorSelected)="onColorSelected($event)"
      />
    </div>
  </main>

  <!-- ── Keyboard shortcuts hint ── -->
  <footer class="shortcuts-hint" aria-label="Keyboard shortcuts">
    <span><kbd>Space</kbd> Generate</span>
    <span><kbd>H</kbd> History</span>
    <span><kbd>E</kbd> Export</span>
    <span><kbd>L</kbd> Lock</span>
    <span><kbd>Esc</kbd> Close</span>
  </footer>

</div>

<!-- ── Panels (portaled to edge of screen) ── -->
<app-history-panel
  id="history-panel"
  [isOpen]="historyOpen()"
  (colorRestored)="onColorRestored($event)"
  (closed)="historyOpen.set(false)"
/>

<app-export-panel
  id="export-panel"
  [isOpen]="exportOpen()"
  [palette]="exportPalette"
  (closed)="exportOpen.set(false)"
/>
